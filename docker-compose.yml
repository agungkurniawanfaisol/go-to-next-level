services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ecoswap-app
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: "5173"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - appraisal_uploads:/app/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "npm install && npx prisma generate && npx prisma db push && (rm -rf .next 2>/dev/null || true) && npm run dev:docker"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: ecoswap-mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
  node_modules:
  appraisal_uploads:
